name: Native app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pantry-pm/pantry/packages/action@v0.11.141
        with:
          version: '0.11.141'
          packages: bun.sh@1.4.3
          install: 'false'
      - run: bun install --frozen-lockfile
      - run: bun run build:site
      - uses: actions/upload-artifact@v6
        with:
          name: marketing-site
          path: dist/site/
          if-no-files-found: error
          retention-days: 7
  native:
    uses: pantry-pm/pantry/.github/workflows/native-app.yml@v0.11.141
    with:
      release: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      PANTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
