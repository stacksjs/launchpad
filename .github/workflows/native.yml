name: Native app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  website:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: pantry-pm/pantry/packages/action@v0.11.171
        with:
          version: '0.11.171'
          packages: bun.sh@1.4.3
          install: 'false'
      - run: bun install --frozen-lockfile
      - run: bun run build:site
      - uses: actions/upload-artifact@v6
        with:
          name: marketing-site
          path: dist/site/
          if-no-files-found: error
          retention-days: 7
  browser:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Use the same Pantry build as the native release; acceptance reads its compiled app HTML.
      - name: Build and qualify native app
        uses: pantry-pm/pantry/packages/action@v0.11.171
        with:
          native-app: check
          release-token: ${{ github.token }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify packaged clipboard persistence
        run: bun run test:clipboard-native
      - name: Install pinned browser
        run: bunx playwright install chromium
      - name: Verify icons, clipboard, updates and installs in both appearances
        run: bun run test:ui
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-acceptance
          path: dist/ui-evidence/
          if-no-files-found: ignore
          retention-days: 7
  native:
    needs: browser
    uses: pantry-pm/pantry/.github/workflows/native-app.yml@v0.11.171
    with:
      release: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      PANTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
