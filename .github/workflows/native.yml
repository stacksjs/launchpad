name: Native app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  native:
    uses: pantry-pm/pantry/.github/workflows/native-app.yml@v0.11.139
    with:
      release: ${{ startsWith(github.ref, 'refs/tags/v') }}
    secrets:
      PANTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
